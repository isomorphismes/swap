name: Swap native slice
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: swap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: ick
        uses: isomorphisms/ai-ci/ick-host@015cc7901ae0b3ad262b476f24e129b53c56db95
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 015cc7901ae0b3ad262b476f24e129b53c56db95
          path: .aici-host
          sparse-checkout: |
            src/aici.c
            contracts/build-toolchain-v0.contract.tsv
          persist-credentials: false
      - name: Enforce shared build-toolchain contract
        run: make -f ci/Makefile verify ICK='${{ steps.ick.outputs.compiler }}'
      - name: Model and geometry checks (not Android evidence)
        env:
          ICK_CC: ${{ steps.ick.outputs.compiler }}
        run: |
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Android NDK
        id: ndk
        run: |
          source DEPS.lock
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"
          printf 'path=%s/ndk/%s\n' "$ANDROID_HOME" "$ANDROID_NDK_VERSION" >> "$GITHUB_OUTPUT"
      - id: compiler
        uses: isomorphisms/ai-ci/ick-android@015cc7901ae0b3ad262b476f24e129b53c56db95
        with:
          abi: ${{ matrix.abi }}
          ndk: ${{ steps.ndk.outputs.path }}
      - name: Build ICK C through the Android NDK platform boundary
        env:
          ICK_CC: ${{ steps.compiler.outputs.compiler }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.path }}
        run: bash scripts/android-build.sh '${{ matrix.abi }}'
      # C67 input test build: disposable signer for a single run.
      # This is not a release signer: no private key or password is uploaded or kept.
      - name: Install C67 APK packaging inputs
        if: matrix.abi == 'armeabi-v7a'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Sign and package C67 input test APK
        if: matrix.abi == 'armeabi-v7a'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/swap-c67-test-only.p12"
          export ANDROID_KEYSTORE_TYPE=PKCS12
          export ANDROID_KEY_ALIAS=swap-c67-test
          export ANDROID_STORE_PASSWORD
          ANDROID_STORE_PASSWORD=$(openssl rand -hex 32)
          export ANDROID_KEY_PASSWORD="$ANDROID_STORE_PASSWORD"
          echo "::add-mask::$ANDROID_STORE_PASSWORD"
          keytool -genkeypair -noprompt \
            -keystore "$ANDROID_KEYSTORE" -storetype "$ANDROID_KEYSTORE_TYPE" \
            -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 3072 \
            -validity 30 -dname 'CN=Swap C67 disposable test,O=Swap' \
            -storepass "$ANDROID_STORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD"
          export ANDROID_EXPECTED_CERT_SHA256
          ANDROID_EXPECTED_CERT_SHA256=$(keytool -exportcert \
            -keystore "$ANDROID_KEYSTORE" -storetype "$ANDROID_KEYSTORE_TYPE" \
            -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" |
            sha256sum | awk '{print $1}')
          bash scripts/android-package.sh armeabi-v7a
          test -s dist/swap-armeabi-v7a.apk
          rm -f -- "$ANDROID_KEYSTORE"
          echo 'C67 INPUT TEST APK: every workflow run has a new signer.'
          echo 'Original Swap stays installed; replace this test variant by uninstalling first.'
      - name: Upload C67 input test APK and verification receipt
        if: matrix.abi == 'armeabi-v7a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swap-c67-input-test-apk
          path: |
            dist/swap-armeabi-v7a.apk
            dist/swap-armeabi-v7a.receipt.tsv
          if-no-files-found: error
          retention-days: 7
