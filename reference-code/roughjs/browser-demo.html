<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swap — Rough.js reference scene</title>
  <style>
    body { margin: 0; background: #171a24; color: #ddd; font: 16px sans-serif; }
    svg { display: block; margin: 0 auto; width: min(90vw, 380px); height: 90vh; }
    p { margin: .6rem; text-align: center; }
  </style>
</head>
<body>
  <p>Rough.js reference only — the Field Mouse port has no browser dependency.</p>
  <svg viewBox="0 0 210 540" xmlns="http://www.w3.org/2000/svg"></svg>
  <script type="module">
    import rough from 'https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.esm.js';

    const svg = document.querySelector('svg');
    const painter = rough.svg(svg);
    const colors = ['#db4666', '#388bdd', '#d49a32'];
    const paths = [
      [[84,20], [125,75], [84,125], [125,180], [84,235], [125,290], [84,345]],
      [[125,20], [84,75], [125,125], [84,180], [125,235], [84,290], [125,345]],
      [[104,20], [104,75], [104,125], [104,180], [104,235], [104,290], [104,345]],
    ];
    paths.forEach((points, i) =>
      svg.append(painter.curve(points, {
        seed: 11 + i, stroke: colors[i], strokeWidth: 3, roughness: 0.7,
      }))
    );

    const triangle = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    svg.append(triangle);
    const original = [[43,450], [166,450], [104,351]];
    const center = 104.5;

    function frame(t) {
      // Turn the colored triangle edge-on and over about its vertical axis.
      const scaleX = Math.cos(t * 0.0008);
      const corners = original.map(([x,y]) => [center + (x - center)*scaleX, y]);
      triangle.replaceChildren();
      for (let i = 0; i < 3; i++) {
        const a = corners[i], b = corners[(i + 1) % 3];
        triangle.append(painter.line(a[0], a[1], b[0], b[1], {
          seed: 21 + i, stroke: colors[i], strokeWidth: 3, roughness: 1,
        }));
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
